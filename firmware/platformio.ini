[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; The Xiao C3 has native USB-CDC. GPIO20/21 (UART0) are used for the motor gate
; and LCD CS, so serial has to come over USB or not at all.
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=1
	; LovyanGFX is configured in src/render/display.cpp, not via build flags.
	-D LGFX_USE_V1
	; Paired phones the knob remembers, and what each listens to (CCCDs). The
	; defaults, 3 and 8 in total, overflowed with an iPhone (~7 subscriptions)
	; and an Android: NimBLE then deletes the oldest bond to make room - which
	; was the iPhone's, cutting its link and forcing a remove-and-re-pair.
	-D CONFIG_BT_NIMBLE_MAX_BONDS=8
	-D CONFIG_BT_NIMBLE_MAX_CCCDS=64

lib_deps =
	lovyan03/LovyanGFX @ 1.2.27  ; 1.2.30 links ~500 KB more and overflows the app partition
	bblanchon/ArduinoJson @ ^7.1.0
	links2004/WebSockets @ ^2.6.1
	h2zero/NimBLE-Arduino @ 2.5.1

; CPU frequency for the firmware. Power behaviour is described in README.md.
board_build.f_cpu = 160000000L

; NimBLE (Music mode) does not fit next to WiFi, TLS and LovyanGFX in the
; default 1.3 MB app slot. huge_app gives 3 MB and drops OTA, which this
; firmware never used.
board_build.partitions = huge_app.csv

; Streams every IMU sample over serial as CSV, for tuning the gesture
; thresholds against real hands rather than guesses. Deep sleep is disabled so
; the device stays awake through a recording.
;
;   pio run -e trace -t upload
[env:trace]
extends = env:xiao_esp32c3
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=1
	-D LGFX_USE_V1
	-D CONFIG_BT_NIMBLE_MAX_BONDS=8
	-D CONFIG_BT_NIMBLE_MAX_CCCDS=64
	-D IMU_TRACE

; Wiring self-test: shorts to ground and between pins (src/diag/pin_diag.cpp).
;
;   pio run -e pindiag -t upload
[env:pindiag]
extends = env:xiao_esp32c3
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=1
	-D LGFX_USE_V1
	-D PIN_DIAG

; Host-side unit tests for the pure logic in lib/knob_music.
;
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
